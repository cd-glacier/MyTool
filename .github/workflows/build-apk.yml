name: Build APK

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Determine build type
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "closed" ]; then
            if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
              echo "PR closed without merge. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BUILD_TYPE="release"
          else
            BUILD_TYPE="debug"
          fi
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-apk" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/*.apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=debug-apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.config.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        if: steps.config.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        if: steps.config.outputs.skip != 'true'
        run: chmod +x ./gradlew

      - name: Setup debug keystore
        if: steps.config.outputs.skip != 'true'
        run: echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > /tmp/debug.keystore

      - name: Build APK
        if: steps.config.outputs.skip != 'true'
        run: ./gradlew ${{ steps.config.outputs.gradle_task }} --no-daemon
        env:
          DEBUG_KEYSTORE_PATH: /tmp/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

      - name: Upload APK
        if: steps.config.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.artifact_name }}
          path: ${{ steps.config.outputs.apk_path }}
          retention-days: 7
